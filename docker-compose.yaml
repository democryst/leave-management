services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: leave_management
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - leave-net

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC
    networks:
      - leave-net

  staff-service:
    build:
      context: .
      dockerfile: services/staff/Dockerfile
    environment:
      DATABASE_URL: postgres://admin:password@postgres:5432/leave_management
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - leave-net

  policy-service:
    build:
      context: .
      dockerfile: services/policy/Dockerfile
    environment:
      DATABASE_URL: postgres://admin:password@postgres:5432/leave_management
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - leave-net

  leave-service:
    build:
      context: .
      dockerfile: services/leave/Dockerfile
    environment:
      DATABASE_URL: postgres://admin:password@postgres:5432/leave_management
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      STAFF_SERVICE_URL: http://staff-service:8081
      POLICY_SERVICE_URL: http://policy-service:8083
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - leave-net

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      STAFF_SERVICE_URL: http://staff-service:8081
      LEAVE_SERVICE_URL: http://leave-service:8082
      POLICY_SERVICE_URL: http://policy-service:8083
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      GATEWAY_RATE_LIMIT_PER_SEC: 100
      GATEWAY_CB_THRESHOLD: 5
      GATEWAY_CB_TIMEOUT_SECS: 30
    depends_on:
      staff-service:
        condition: service_started
      leave-service:
        condition: service_started
      policy-service:
        condition: service_started
    networks:
      - leave-net

  web:
    build:
      context: web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    networks:
      - leave-net

networks:
  leave-net:
    driver: bridge
