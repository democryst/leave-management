apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: leave-management/gateway:latest
        ports:
        - containerPort: 8080
        env:
        - name: STAFF_SERVICE_URL
          value: "http://staff-service:8081"
        - name: LEAVE_SERVICE_URL
          value: "http://leave-service:8082"
        - name: POLICY_SERVICE_URL
          value: "http://policy-service:8083"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://jaeger:4317"
        - name: GATEWAY_RATE_LIMIT_PER_SEC
          value: "200"
        - name: GATEWAY_CB_THRESHOLD
          value: "10"
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: LoadBalancer
