version: '3.8'

services:
  # --- Databases ---
  # Isolated per domain according to DDD principles
  staff_db:
    image: postgres:15-alpine
    container_name: staff_db
    environment:
      POSTGRES_USER: staff_user
      POSTGRES_PASSWORD: ${STAFF_DB_PASSWORD:-secret}
      POSTGRES_DB: staff_database
    ports:
      - "5432:5432"
    volumes:
      - staff_data:/var/lib/postgresql/data
    networks:
      - monitoring-network

  leave_db:
    image: postgres:15-alpine
    container_name: leave_db
    environment:
      POSTGRES_USER: leave_user
      POSTGRES_PASSWORD: ${LEAVE_DB_PASSWORD:-secret}
      POSTGRES_DB: leave_database
    ports:
      - "5433:5432"
    volumes:
      - leave_data:/var/lib/postgresql/data
    networks:
      - monitoring-network

  policy_db:
    image: postgres:15-alpine
    container_name: policy_db
    environment:
      POSTGRES_USER: policy_user
      POSTGRES_PASSWORD: ${POLICY_DB_PASSWORD:-secret}
      POSTGRES_DB: policy_database
    ports:
      - "5434:5432"
    volumes:
      - policy_data:/var/lib/postgresql/data
    networks:
      - monitoring-network

  # --- Observability Stack ---
  # Centralizes distributed traces from all microservices
  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: otel_collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    depends_on:
      - jaeger
    networks:
      - monitoring-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger_ui
    ports:
      - "16686:16686" # Jaeger UI
      - "14250:14250" # gRPC endpoint
    networks:
      - monitoring-network

  # --- Backend Services ---
  staff-service:
    build:
      context: ..
      dockerfile: services/staff/Dockerfile
    container_name: staff_service
    environment:
      - DATABASE_URL=postgres://staff_user:${STAFF_DB_PASSWORD:-secret}@staff_db:5432/staff_database
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      - staff_db
      - otel-collector
    networks:
      - monitoring-network

  leave-service:
    build:
      context: ..
      dockerfile: services/leave/Dockerfile
    container_name: leave_service
    environment:
      - DATABASE_URL=postgres://leave_user:${LEAVE_DB_PASSWORD:-secret}@leave_db:5432/leave_database
      - POLICY_SERVICE_URL=http://policy-service:8083
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      - leave_db
      - otel-collector
    networks:
      - monitoring-network

  policy-service:
    build:
      context: ..
      dockerfile: services/policy/Dockerfile
    container_name: policy_service
    environment:
      - DATABASE_URL=postgres://policy_user:${POLICY_DB_PASSWORD:-secret}@policy_db:5432/policy_database
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      - policy_db
      - otel-collector
    networks:
      - monitoring-network

  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    container_name: api_gateway
    ports:
      - "8080:8080"
    environment:
      - STAFF_SERVICE_URL=http://staff-service:8081
      - LEAVE_SERVICE_URL=http://leave-service:8082
      - EDGE_JWT_SECRET=${EDGE_JWT_SECRET:-dev_secret}
      - IST_PRIVATE_KEY=${IST_PRIVATE_KEY:-dev_key}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      - staff-service
      - leave-service
      - policy-service
      - otel-collector
    networks:
      - monitoring-network

  # --- Frontend ---
  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: leave_web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080 # Client-side URL
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318 # HTTP for browser
    depends_on:
      - gateway
      - otel-collector
    networks:
      - monitoring-network

volumes:
  staff_data:
  leave_data:
  policy_data:

networks:
  monitoring-network:
    driver: bridge
